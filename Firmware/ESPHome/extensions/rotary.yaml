sensor:
  # ==========================================
  # ROTARY ENCODER (Rotation)
  # ==========================================
  - platform: rotary_encoder
    name: "Fan Speed Encoder"
    id: rotary_encoder_speed
    pin_a: 5
    pin_b: 4
    min_value: 0
    max_value: 100
    resolution: 1
    
    on_value:
      then:
        - if:
            # IF 0 ALL OFF
            condition:
              lambda: 'return x == 0;'
            then:
              - fan.turn_off: fan0
              - fan.turn_off: fan1
              - fan.turn_off: fan2
              - fan.turn_off: fan3
            
            # ELSE ON
            else:
              - fan.turn_on:
                  id: fan0
                  speed: !lambda 'return x;'
              - fan.turn_on:
                  id: fan1
                  speed: !lambda 'return x;'
              - fan.turn_on:
                  id: fan2
                  speed: !lambda 'return x;'
              - fan.turn_on:
                  id: fan3
                  speed: !lambda 'return x;'

binary_sensor:
  # ==========================================
  # ROTARY ENCODER (Push-Button)
  # ==========================================
  - platform: gpio
    name: "Rotary Button"
    id: rotary_button
    pin:
      number: 3
      inverted: true
      mode:
        input: true
        pullup: true
    
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
      
    # ALL OFF
    on_press:
      then:
        - fan.turn_off: fan0
        - fan.turn_off: fan1
        - fan.turn_off: fan2
        - fan.turn_off: fan3
        - sensor.rotary_encoder.set_value:
            id: rotary_encoder_speed
            value: 0