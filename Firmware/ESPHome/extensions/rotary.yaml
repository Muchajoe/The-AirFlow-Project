# DREHREGLER (Rotation)
  - platform: rotary_encoder
    name: "Fan Speed Encoder"
    id: rotary_encoder_speed
    pin_a:
      number: 5
      mode:
        input: true
        pullup: true # HIER IST DER FIX
    pin_b:
      number: 4
      mode:
        input: true
        pullup: true # HIER IST DER FIX
    min_value: 0
    max_value: 100
    resolution: 1
    
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x == 0;'
            then:
              - fan.turn_off: fan0
              - fan.turn_off: fan1
              - fan.turn_off: fan2
              - fan.turn_off: fan3
            else:
              - fan.turn_on:
                  id: fan0
                  speed: !lambda 'return x;'
              - fan.turn_on:
                  id: fan1
                  speed: !lambda 'return x;'
              - fan.turn_on:
                  id: fan2
                  speed: !lambda 'return x;'
              - fan.turn_on:
                  id: fan3
                  speed: !lambda 'return x;'
