sensor:
  # 1. Native ADC Sensor (reads the voltage cleanly from Pin 7)
  - platform: adc
    pin: 7
    id: current_sense_v
    name: "CS Raw Voltage"
    update_interval: 1s
    attenuation: 11db
    filters:
      # Calculates the average of 10 measurements for smoother readings
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1

  # 2. Your Power Sensor
  - platform: template
    name: "Fan Power Consumption"
    id: system_power
    unit_of_measurement: "W"
    device_class: "power"
    state_class: "measurement"
    update_interval: 1s
    lambda: |-
      const float R_CS = 330.0;        
      const float K_CS = 500.0;          
      const float SYSTEM_VOLTAGE = 12.0;
      const float I_LIMIT = 2.466;   
      const float BOARD_CALIBRATION = 1.087;
      
      // Fetch voltage from the native ADC (is already in Volts!)
      // If the sensor doesn't have a value yet, abort (prevents boot errors)
      if (std::isnan(id(current_sense_v).state)) {
        return {};
      }
      float raw_v = id(current_sense_v).state;
      
      // ESP32 ADC Deadzone Correction:
      // Voltages below 0.08V (80mV) are pure noise at 0A load. 
      // We hardcode the value to 0 so the consumption is 0W when fans are off.
      if (raw_v < 0.08) {
        return 0.0;
      }
      
      // Current and Power Calculation
      float current_A = ((raw_v / R_CS) * K_CS) * BOARD_CALIBRATION;
      float power_W = current_A * SYSTEM_VOLTAGE;

      // Output warning to the log
      if (current_A >= (I_LIMIT - 0.05)) {
        ESP_LOGW("power_sensor", "WARNING: HARDWARE CURRENT LIMIT ACTIVE! (%.2f A)", current_A);
      }

      return power_W;