globals:
  - id: zero_offset_mv
    type: float
    initial_value: '0.0'

esphome:
  # ... (dein restlicher esphome: block)
  on_boot:
    priority: 250 
    then:
      - lambda: |-
          ESP_LOGI("current_sensor", "Calibrate Zero Offset...");
          uint32_t sum = 0;
          
          // Kurze Pause, damit die interne ESP-Spannung nach dem Boot sauber anliegt
          delay(10); 
          
          for (int i = 0; i < 50; i++) {
            sum += analogReadMilliVolts(7); 
            delay(5); 
          }
          
          id(zero_offset_mv) = sum / 50.0;
          ESP_LOGI("current_sensor", "Calibration Done. Offset: %.1f mV", id(zero_offset_mv));

sensor:
  - platform: template
    name: "Fan Power Consumption"
    id: system_power
    unit_of_measurement: "W"
    device_class: "power"
    state_class: "measurement"
    update_interval: 1s
    lambda: |-
      const float R_CS = 330.0;        
      const float K_CS = 500.0;          
      const float SYSTEM_VOLTAGE = 12.0;
      const float I_LIMIT = 2.466;   
      const float BOARD_CALIBRATION = 1.087;
      
      uint32_t sum_mv = 0;
      const int NUM_SAMPLES = 20; // Von 10 auf 20 erhöht für weichere Messwerte
      
      for (int i = 0; i < NUM_SAMPLES; i++) {
        sum_mv += analogReadMilliVolts(7);
        delay(2);
      }
      
      float raw_mv = (sum_mv / (float)NUM_SAMPLES);
      float corrected_mv = raw_mv - id(zero_offset_mv);
      
      // Verhindern, dass Messrauschen negative Werte erzeugt
      if (corrected_mv < 0.0) {
        corrected_mv = 0.0;
      }
      
      float v_cs = corrected_mv / 1000.0; // Umrechnung in Volt
      
      // HIER WAR DER FEHLER: v_cs statt raw_mv nutzen! (2.5 Volt = 2500 mV)
      if (v_cs > 2.5) {
        ESP_LOGD("current_sensor", "Open-Load or Overvoltage. Set to 0W.");
        return 0.0; 
      }
      
      float current_A = ((v_cs / R_CS) * K_CS) * BOARD_CALIBRATION;
      
      // Deadband-Filter: Werte unter 0.03 A (30mA) werden als 0 gewertet.
      // Filtert das ADC-Rauschen, wenn alle Lüfter aus sind.
      if (current_A < 0.03) {
        current_A = 0.0;
      }
      
      float power_W = current_A * SYSTEM_VOLTAGE;

      if (current_A >= (I_LIMIT - 0.05)) {
        ESP_LOGW("current_sensor", "WARNING: HARDWARE-CURRENT LIMIT! (%.2f A)", current_A);
      }

      return power_W;