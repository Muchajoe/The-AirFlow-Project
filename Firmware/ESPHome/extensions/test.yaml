sensor:
  # ==========================================
  # 1. NATIVE ADC MESSUNG (Spannung lesen)
  # ==========================================
  - platform: adc
    pin: 7
    id: efuse_voltage
    name: "eFuse Raw Voltage"
    attenuation: 11db # WICHTIG: Erlaubt das Lesen von 0V bis ~3.1V
    update_interval: 200ms # Holt oft Werte für weichere Daten
    filters:
      # Wir bilden einen gleitenden Durchschnitt über 5 Werte (1 Sekunde)
      - sliding_window_moving_average:
          window_size: 5
          send_every: 5

  # ==========================================
  # 2. BERECHNUNG DER WATTZAHL
  # ==========================================
  - platform: template
    name: "Fan Power Consumption"
    id: system_power
    unit_of_measurement: "W"
    device_class: "power"
    state_class: "measurement"
    update_interval: 1s
    lambda: |-
      // Holt die bereits vom ADC geglättete Spannung (ist bereits in VOLT!)
      float v_cs = id(efuse_voltage).state;
      
      // Abbruch, falls der ADC noch keinen gültigen Wert hat
      if (isnan(v_cs)) {
        return 0.0;
      }

      const float R_CS = 330.0;        
      const float K_CS = 500.0;          
      const float SYSTEM_VOLTAGE = 12.0;
      const float I_LIMIT = 2.466;   
      const float BOARD_CALIBRATION = 1.087;
      
      // Falls die eFuse im Leerlauf ein leichtes Rauschen ausgibt (z.B. 10mV), 
      // kannst du es hier abziehen. Standard: 0.0 (kein Offset nötig)
      const float VOLTAGE_OFFSET = 0.000; 
      
      v_cs = v_cs - VOLTAGE_OFFSET;
      
      if (v_cs < 0.0) {
        v_cs = 0.0;
      }
      
      // Open-Load Check
      if (v_cs > 2.5) {
        ESP_LOGD("current_sensor", "Open-Load or Overvoltage. V_CS: %.2fV", v_cs);
        return 0.0; 
      }
      
      // Strom berechnen
      float current_A = ((v_cs / R_CS) * K_CS) * BOARD_CALIBRATION;
      
      // Deadband-Filter: ADC Rauschen unter 30mA wird als 0W gewertet
      if (current_A < 0.03) {
        current_A = 0.0;
      }
      
      // Leistung in Watt
      float power_W = current_A * SYSTEM_VOLTAGE;

      if (current_A >= (I_LIMIT - 0.05)) {
        ESP_LOGW("current_sensor", "WARNING: HARDWARE-CURRENT LIMIT! (%.2f A)", current_A);
      }

      return power_W;