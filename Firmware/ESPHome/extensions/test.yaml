sensor:
  # ==========================================
  # 1. EXTREM GEGLÄTTETE ADC MESSUNG
  # ==========================================
  - platform: adc
    pin: 7
    id: efuse_voltage
    name: "eFuse Raw Voltage"
    attenuation: 11db
    update_interval: 100ms  # Sehr schnell messen (10x pro Sekunde)
    filters:
      - sliding_window_moving_average:
          window_size: 20   # Durchschnitt der letzten 2 Sekunden bilden
          send_every: 10    # Jede Sekunde einen stark beruhigten Wert ausgeben
    accuracy_decimals: 3

  # ==========================================
  # 2. BERECHNUNG DER WATTZAHL
  # ==========================================
  - platform: template
    name: "Fan Power Consumption"
    id: system_power
    unit_of_measurement: "W"
    device_class: "power"
    state_class: "measurement"
    update_interval: 1s
    lambda: |-
      float v_cs = id(efuse_voltage).state;
      
      if (isnan(v_cs)) {
        return 0.0;
      }

      const float R_CS = 330.0;        
      const float K_CS = 500.0;          
      const float SYSTEM_VOLTAGE = 12.0;
      const float I_LIMIT = 2.466;   
      const float BOARD_CALIBRATION = 1.087;
      
      // ==========================================
      // DEIN NEUER NULLPUNKT (OFFSET)
      // ==========================================
      // Beobachte den Wert von "eFuse Raw Voltage" wenn alle Lüfter AUS sind.
      // Er sollte jetzt durch den Filter viel ruhiger sein (z.B. konstant 0.15V).
      // Trage exakt diesen Ruhewert hier ein:
      const float VOLTAGE_OFFSET = 0.150; 
      
      // Offset abziehen
      v_cs = v_cs - VOLTAGE_OFFSET;
      
      // Alles was durch leichtes Restrauschen unter 0 fällt, abschneiden
      if (v_cs < 0.0) {
        v_cs = 0.0;
      }
      
      // Strom berechnen
      float current_A = ((v_cs / R_CS) * K_CS) * BOARD_CALIBRATION;
      
      // Härterer Deadband-Filter: Wenn der errechnete Strom unter 0.05 A (600mW) liegt,
      // werten wir es als Rauschen und setzen es auf 0.0 Watt.
      if (current_A < 0.05) {
        current_A = 0.0;
      }
      
      float power_W = current_A * SYSTEM_VOLTAGE;

      return power_W;