# ==========================================
# POWER SUPPLY ENABLE LOGIC
# ==========================================
switch:
  - platform: gpio
    pin: 44
    id: psu_enable
    name: "Power Supply Enable"
    restore_mode: ALWAYS_OFF
# ==========================================
# POWER SUPPLY ENABLE LOGIC
# ==========================================
interval:
  - interval: 250ms
    then:
      - if:
          condition:
            lambda: |-
              return (id(fan0).state || 
                      id(fan1).state || 
                      id(fan2).state || 
                      id(fan3).state);
          then:
            - switch.turn_on: psu_enable
          else:
            - switch.turn_off: psu_enable

# ==========================================
# FAN PWM OUTPUTS
# ==========================================
output:
  - platform: ledc
    id: fan0_pwm
    pin: 13
    frequency: 25000 Hz
  - platform: ledc
    id: fan1_pwm
    pin: 12
    frequency: 25000 Hz
  - platform: ledc
    id: fan2_pwm
    pin: 2
    frequency: 25000 Hz
  - platform: ledc
    id: fan3_pwm
    pin: 1
    frequency: 25000 Hz

# ==========================================
# FAN ENTITIES
# ==========================================
fan:
  - platform: speed
    output: fan0_pwm
    name: "Fan 0"
    id: fan0
  - platform: speed
    output: fan1_pwm
    name: "Fan 1"
    id: fan1
  - platform: speed
    output: fan2_pwm
    name: "Fan 2"
    id: fan2
  - platform: speed
    output: fan3_pwm
    name: "Fan 3"
    id: fan3

# ==========================================
# RPM SENSORS
# ==========================================
sensor:
  - platform: pulse_counter
    pin: 11
    name: "Fan 0 RPM"
    id: fan0_rpm
    unit_of_measurement: "RPM"
    update_interval: 5s
    filters:
      - multiply: 0.5
  - platform: pulse_counter
    pin: 10
    name: "Fan 1 RPM"
    id: fan1_rpm
    unit_of_measurement: "RPM"
    update_interval: 5s
    filters:
      - multiply: 0.5
  - platform: pulse_counter
    pin: 9
    name: "Fan 2 RPM"
    id: fan2_rpm
    unit_of_measurement: "RPM"
    update_interval: 5s
    filters:
      - multiply: 0.5
  - platform: pulse_counter
    pin: 8
    name: "Fan 3 RPM"
    id: fan3_rpm
    unit_of_measurement: "RPM"
    update_interval: 5s
    filters:
      - multiply: 0.5

# ==========================================
# RGB LED
# ==========================================
light:
  - platform: esp32_rmt_led_strip
    pin: 21
    num_leds: 1
    rgb_order: GRB
    chipset: WS2812
    name: "Board Status LED"

# ==========================================
# BOOT BUTTON & FACTORY RESET
# ==========================================
button:
  - platform: factory_reset
    name: "Factory Reset Action"
    id: factory_reset_btn

binary_sensor:
  - platform: gpio
    pin:
      number: 0
      inverted: true
      mode:
        input: true
        pullup: true
    id: boot_button
    name: "Reset"
    filters:
      - delayed_on: 5s
    on_press:
      - button.press: factory_reset_btn